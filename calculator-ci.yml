stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: "yugandhar25/calculator-app"

test_job:
  stage: test
  image: python:3.9
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest

build_job:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Image name is $IMAGE_NAME"
    - docker build -t $IMAGE_NAME .
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
    - docker push $IMAGE_NAME

deploy_job:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - ssh -o StrictHostKeyChecking=no ubuntu@$EC2_IP "
        sudo docker pull yugandhar25/calculator-app &&
        sudo docker stop \$(sudo docker ps -q) || true &&
        sudo docker rm \$(sudo docker ps -aq) || true &&
        sudo docker run -d -p 80:5000 yugandhar25/calculator-app
      "
